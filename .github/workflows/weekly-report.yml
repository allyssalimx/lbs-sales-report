name: Weekly store sales report

on:
  schedule:
    # Singapore time = UTC + 8. Staggered 5 min after the daily job to avoid push clashes.
    - cron: "5 7 * * *"    # 3:05pm SGT
    - cron: "5 10 * * *"   # 6:05pm SGT (retry until the week's last day is in)
    - cron: "5 13 * * *"   # 9:05pm SGT (retry)
  workflow_dispatch:
    inputs:
      period:
        description: "Optional: a date (YYYY-MM-DD) in the week you want to send. Blank = normal run."
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Send weekly report
        env:
          MODE: week
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PERIOD: ${{ github.event.inputs.period }}
        run: python period_report.py
      - name: Remember last week sent
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_sent_week.txt)" ]; then
            git config user.name "sales-report-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_sent_week.txt
            git commit -m "Weekly report sent for week ending $(cat last_sent_week.txt)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          fi
