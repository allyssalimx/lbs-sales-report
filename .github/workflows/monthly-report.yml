name: Monthly store sales report

on:
  schedule:
    # Singapore time = UTC + 8. Staggered 10 min after the daily job to avoid push clashes.
    - cron: "10 7 * * *"   # 3:10pm SGT
    - cron: "10 10 * * *"  # 6:10pm SGT (retry until the month's last day is in)
    - cron: "10 13 * * *"  # 9:10pm SGT (retry)
  workflow_dispatch:
    inputs:
      period:
        description: "Optional: a month (YYYY-MM) you want to send. Blank = normal run."
        required: false

permissions:
  contents: write

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Send monthly report
        env:
          MODE: month
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          PERIOD: ${{ github.event.inputs.period }}
        run: python period_report.py
      - name: Remember last month sent
        if: always()
        run: |
          if [ -n "$(git status --porcelain last_sent_month.txt)" ]; then
            git config user.name "sales-report-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_sent_month.txt
            git commit -m "Monthly report sent for $(cat last_sent_month.txt)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          fi
