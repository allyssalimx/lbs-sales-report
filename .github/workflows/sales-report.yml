name: Daily store sales report

on:
  schedule:
    # Singapore time = UTC + 8. Odd minute (:17) avoids the top-of-hour queue,
    # which GitHub delays or skips most often.
    - cron: "17 7 * * *"    # ~3:17pm SGT
    - cron: "17 10 * * *"   # ~6:17pm SGT (retry if data wasn't in)
    - cron: "17 13 * * *"   # ~9:17pm SGT (retry if data wasn't in)
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional: send one specific date (YYYY-MM-DD). Leave blank for the normal daily run."
        required: false

permissions:
  contents: write

concurrency:
  group: sales-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Send report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: python report.py
      - name: Remember last day sent
        if: always()
        run: |
          if [ -f last_sent.txt ] && [ -n "$(git status --porcelain last_sent.txt)" ]; then
            git config user.name "sales-report-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_sent.txt
            git commit -m "Sent report for $(cat last_sent.txt)"
            git push
          fi
